{% extends "layout.html" %}
{% block content %}
<link rel="stylesheet" href="/stylesheets/usuarios.css">
<div class="usuarios">
    <h1 class="titulo">Actualizar usuario</h1>

    <form action="/usuarios/{{usuario.id}}" method="POST" class="formulario">
        <input type="hidden" name="_method" value="PUT">
        <label>Username:</label>
        <input type="text" name="username" value="{{usuario.username}}" required>
        <label>Email:</label>
        <input type="text" name="email" value="{{usuario.email}}" required>
        <label>Password:</label>
        <input type="text" name="password" value="">
        <button type="submit">Actualizar</button>
        <button type="reset">Restaurar</button>
    </form>
</div>
{% endblock %}
